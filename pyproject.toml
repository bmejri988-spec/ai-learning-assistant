[project]
name = "ai-learning-assistant"
version = "0.1.0"
description = "AI Study Assistant project scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "chromadb",
    "langchain",
    "langchain-huggingface",
    "pypdf",
    "python-multipart",
    "sentence-transformers",
    "uvicorn[standard]",
    "pydantic",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx2",
]
